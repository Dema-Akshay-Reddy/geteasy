services:
  - type: web
    name: geteasy-api
    runtime: python
    plan: free
    rootDir: subject-guide/backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma_data
      - key: ANONYMIZED_TELEMETRY
        value: "False"
